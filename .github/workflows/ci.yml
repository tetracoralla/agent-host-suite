name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run audit:production

  macos-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: ./scripts/check-manager-models.sh
      - run: ./scripts/check-swift-concurrency.sh
      - name: Create a bound packaging fixture
        run: >-
          node --input-type=module -e
          "import { readFile } from 'node:fs/promises';
          import { createReleaseFixture } from './test/release-helpers.mjs';
          const pkg=JSON.parse(await readFile('./package.json','utf8'));
          await createReleaseFixture('.build/ci-package', {
            suiteVersion: pkg.version, releaseId: 'ci-package', marker: 'ci', includeObservability: true,
          });"
      - run: AGENT_HOST_RELEASE_CATALOG="$PWD/.build/ci-package/catalog" ./scripts/package-macos-app.sh debug
      - run: codesign --verify --deep --strict ".build/Agent Host.app"

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Verify real private Windows access lists
        run: node --test --test-timeout=60000 test/private-permissions.test.mjs
      - name: Verify Host source and installed package
        # The timeout covers a whole test file, including many installer lifecycles
        # and real ACL subprocesses; it is not a per-operation latency fence.
        run: npm run check:syntax && node --test --test-timeout=900000 test/*.test.mjs && npm run check:repository && npm run check:package
      - run: npm run audit:production

  windows-packages:
    name: Windows ${{ matrix.workspace }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        workspace: [direct-execution-runtime, capability-http-bridge, agent-tool-observer, context-surface-analyzer]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run check --workspace @openadam/${{ matrix.workspace }}

  windows-packaging:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Reject unrelated installation directories
        run: ./scripts/test-windows-installation.ps1
      - name: Create a complete bound Windows packaging fixture
        shell: pwsh
        run: >-
          node --input-type=module -e
          "import { readFile } from 'node:fs/promises';
          import { createReleaseFixture } from './test/release-helpers.mjs';
          const pkg=JSON.parse(await readFile('./package.json','utf8'));
          await createReleaseFixture('.build/ci-windows', {
            suiteVersion: pkg.version, releaseId: 'ci-windows', marker: 'ci',
            includeObservability: true, includeDeveloper: true,
          });"
      - name: Package, install, execute, and uninstall without source
        shell: pwsh
        env:
          AGENT_HOST_RELEASE_CATALOG: ${{ github.workspace }}\.build\ci-windows\catalog
          AGENT_HOST_ALLOW_LOCAL_SOURCE_DISTRIBUTION: "1"
        run: |
          npm run package:windows
          $archive = Get-ChildItem -LiteralPath '.build\windows\distribution' -Filter '*.zip' | Select-Object -First 1
          $expanded = Join-Path $env:RUNNER_TEMP 'agent-host-package'
          $install = Join-Path $env:RUNNER_TEMP 'Agent Host'
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $expanded
          $bundle = Get-ChildItem -LiteralPath $expanded -Directory | Select-Object -First 1
          & (Join-Path $bundle.FullName 'Install-AgentHost.ps1') -InstallRoot $install -NoPath -NoShortcuts -NoLaunch
          & (Join-Path $install 'runtime\node.exe') (Join-Path $install 'app\bin\agent-host.mjs') --help
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows CLI failed' }
          & (Join-Path $install 'Uninstall-AgentHost.ps1') -InstallRoot $install
          if (Test-Path -LiteralPath $install) { throw 'Windows uninstaller left the application installed' }
