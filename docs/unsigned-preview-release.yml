# Required unsigned preview pipeline draft (docs/). Copy to
# .github/workflows/unsigned-preview-release.yml only with GitHub workflow scope;
# that path is not enabled until the file exists under .github/workflows/.
# The notarized .github/workflows/release.yml remains a separate signed path
# and requires Apple secrets. This unsigned preview must not request them.
# Each platform job admits GitHub tools for that runner. Do not reuse another
# OS archive and relabel it. Gatekeeper (Control-click → Open) remains required.

name: Unsigned preview release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Admit GitHub tools for this macOS runner
        run: node scripts/admit-github-plugin.mjs --registry --output .build/github-tools
      - name: Package unsigned macOS app from verified Host internals and admitted GitHub tools
        run: |
          node scripts/build-unsigned-preview-catalog.mjs --output .build/unsigned-catalog --github-tools .build/github-tools
          ids="$(node -e 'const m=require("./.build/unsigned-catalog/current.json"); process.stdout.write(m.components.map(c=>c.id).join(","))')"
          AGENT_HOST_BUNDLED_COMPONENTS="$ids" AGENT_HOST_RELEASE_CATALOG="$PWD/.build/unsigned-catalog" ./scripts/package-macos-app.sh release
      - name: Wrap an unsigned DMG
        run: |
          echo "APP_ARCH=$(uname -m)" >> "$GITHUB_ENV"
          version="$(node -e 'const pkg=require("./package.json"); process.stdout.write(pkg.version)')"
          arch="$(uname -m)"
          if [[ "$arch" == "x86_64" ]]; then arch="x86_64"; else arch="arm64"; fi
          dmg=".build/Agent-Host-${version}-darwin-${arch}.dmg"
          staging=".build/dmg-root-$$"
          mkdir -p "$staging" .build
          cp -R ".build/Agent Host.app" "$staging/Agent Host.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Agent Host Preview" -srcfolder "$staging" -ov -format UDZO "$dmg"
          rm -rf "$staging"
          echo "DMG_PATH=$dmg" >> "$GITHUB_ENV"
          echo "SUITE_VERSION=$version" >> "$GITHUB_ENV"
          (cd .build && shasum -a 256 "$(basename "$dmg")" > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned
          path: |
            .build/Agent-Host-*.dmg
            .build/SHA256SUMS
            .build/unsigned-catalog/current.json

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Admit GitHub tools for this Windows runner
        run: node scripts/admit-github-plugin.mjs --registry --output .build/github-tools
      - name: Package unsigned Windows ZIP
        shell: pwsh
        env:
          AGENT_HOST_ALLOW_LOCAL_SOURCE_DISTRIBUTION: "1"
        run: |
          node scripts/build-unsigned-preview-catalog.mjs --output .build/unsigned-catalog --github-tools .build/github-tools
          $ids = (Get-Content -Raw .build/unsigned-catalog/current.json | ConvertFrom-Json).components.id -join ','
          $env:AGENT_HOST_BUNDLED_COMPONENTS = $ids
          $env:AGENT_HOST_RELEASE_CATALOG = Join-Path $PWD '.build\unsigned-catalog'
          npm run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: |
            .build/windows/distribution/Agent-Host-*.zip
            .build/unsigned-catalog/current.json

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: .build/release-assets
      - name: Create unsigned GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$'Unsigned preview. Not Apple-notarized and not an App Store build.\n\nApplication carriers and the GitHub tool catalog are separate Release assets. Do not treat GitHub latest as a tool catalog.\n\nEach platform job admitted GitHub tools for that runner. Native archives are not reused across operating systems.\n\nmacOS: Control-click Agent Host.app, choose Open, confirm Gatekeeper.\nWindows: SmartScreen may warn; compare SHA-256 before running.\n\nThe bundled catalog is built from official Node, this repository’s Host runtime packages, Math Anchor, Migratory Time, Observer adapters, and GitHub tools admitted from public Releases for that platform. It is not a test fixture.\n\nprofiles fetch --carrier downloads an installer. agent-host app update on a supported OS mounts or unpacks the carrier, replaces the installed application, and relaunches it after comparing digests.'
          files=()
          while IFS= read -r path; do files+=("$path"); done < <(find .build/release-assets -type f)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --prerelease --verify-tag --title "Agent Host unsigned preview" --notes "$notes"
