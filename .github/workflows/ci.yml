name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run check

  macos-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: ./scripts/check-manager-models.sh
      - run: swift build --scratch-path .build/swift6-check -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -warnings-as-errors
      - name: Create a bound packaging fixture
        run: >-
          node --input-type=module -e
          "import { createReleaseFixture } from './test/release-helpers.mjs';
          await createReleaseFixture('.build/ci-package', {
            suiteVersion: '0.1.1-ci', releaseId: 'ci-package', marker: 'ci', includeObservability: true,
          });"
      - run: AGENT_HOST_RELEASE_CATALOG="$PWD/.build/ci-package/catalog" ./scripts/package-macos-app.sh debug
      - run: codesign --verify --deep --strict ".build/Agent Host.app"
