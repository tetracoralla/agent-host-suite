name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: ./scripts/package-macos-app.sh release
      - name: Record runner architecture
        run: echo "APP_ARCH=$(uname -m)" >> "$GITHUB_ENV"
      - name: Require signing and notarization credentials
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_NAME }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          test -n "$CERTIFICATE"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$SIGNING_IDENTITY"
          test -n "$NOTARY_KEY"
          test -n "$NOTARY_KEY_ID"
          test -n "$NOTARY_ISSUER"
      - name: Sign, notarize, and verify
        env:
          CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERT_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_NAME }}
          NOTARY_KEY: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          keychain="$RUNNER_TEMP/agent-host-signing.keychain-db"
          certificate="$RUNNER_TEMP/developer-id.p12"
          notary_key="$RUNNER_TEMP/AuthKey.p8"
          password="$(openssl rand -hex 24)"
          echo "$CERTIFICATE" | base64 --decode > "$certificate"
          echo "$NOTARY_KEY" | base64 --decode > "$notary_key"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          codesign --force --deep --options runtime --timestamp --sign "$SIGNING_IDENTITY" ".build/Agent Host.app"
          archive=".build/Agent-Host-macos-${APP_ARCH}.zip"
          ditto -c -k --keepParent ".build/Agent Host.app" "$archive"
          xcrun notarytool submit "$archive" --key "$notary_key" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --wait
          xcrun stapler staple ".build/Agent Host.app"
          codesign --verify --deep --strict --verbose=2 ".build/Agent Host.app"
          spctl --assess --type execute --verbose=4 ".build/Agent Host.app"
          ditto -c -k --keepParent ".build/Agent Host.app" "$archive"
          (cd .build && shasum -a 256 "$(basename "$archive")" > SHA256SUMS)
      - run: npm pack --pack-destination .build
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            ".build/Agent-Host-macos-${APP_ARCH}.zip" \
            ".build/SHA256SUMS" \
            .build/openadam-agent-host-suite-*.tgz \
            --verify-tag --generate-notes
