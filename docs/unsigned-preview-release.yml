# Copy to .github/workflows/release.yml (and copy docs/scan-github-tools.yml
# to .github/workflows/scan-github-tools.yml) from an account with the
# GitHub `workflow` scope. This is an unsigned preview. It must not request
# Apple Developer ID or notary secrets. Gatekeeper (Control-click → Open)
# remains required.

name: Unsigned preview release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Admit registered GitHub tools from public Releases
        run: node scripts/admit-github-plugin.mjs --registry --output .build/github-tools
      - uses: actions/upload-artifact@v4
        with:
          name: github-tools
          path: .build/github-tools

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Package unsigned macOS app from a packaging catalog
        run: |
          node --input-type=module -e "
            import { readFile } from 'node:fs/promises';
            import { createReleaseFixture } from './test/release-helpers.mjs';
            const pkg = JSON.parse(await readFile('./package.json', 'utf8'));
            await createReleaseFixture('.build/unsigned-package', {
              suiteVersion: pkg.version,
              releaseId: 'unsigned-preview-package',
              marker: 'unsigned',
              includeObservability: true,
            });
          "
          AGENT_HOST_RELEASE_CATALOG="$PWD/.build/unsigned-package/catalog" ./scripts/package-macos-app.sh release
      - name: Wrap an unsigned DMG
        run: |
          echo "APP_ARCH=$(uname -m)" >> "$GITHUB_ENV"
          version="$(node -e 'const pkg=require("./package.json"); process.stdout.write(pkg.version)')"
          arch="$(uname -m)"
          if [[ "$arch" == "x86_64" ]]; then arch="x86_64"; else arch="arm64"; fi
          dmg=".build/Agent-Host-${version}-darwin-${arch}.dmg"
          staging=".build/dmg-root-$$"
          mkdir -p "$staging" .build
          cp -R ".build/Agent Host.app" "$staging/Agent Host.app"
          ln -s /Applications "$staging/Applications"
          hdiutil create -volname "Agent Host Preview" -srcfolder "$staging" -ov -format UDZO "$dmg"
          rm -rf "$staging"
          echo "DMG_PATH=$dmg" >> "$GITHUB_ENV"
          echo "SUITE_VERSION=$version" >> "$GITHUB_ENV"
          (cd .build && shasum -a 256 "$(basename "$dmg")" > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: macos-unsigned
          path: |
            .build/Agent-Host-*.dmg
            .build/SHA256SUMS

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - name: Package unsigned Windows ZIP
        shell: pwsh
        env:
          AGENT_HOST_ALLOW_LOCAL_SOURCE_DISTRIBUTION: "1"
        run: |
          node --input-type=module -e "import { readFile } from 'node:fs/promises'; import { createReleaseFixture } from './test/release-helpers.mjs'; const pkg=JSON.parse(await readFile('./package.json','utf8')); await createReleaseFixture('.build/unsigned-package', { suiteVersion: pkg.version, releaseId: 'unsigned-preview-package', marker: 'unsigned', includeObservability: true });"
          $env:AGENT_HOST_RELEASE_CATALOG = Join-Path $PWD '.build\unsigned-package\catalog'
          npm run package:windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: .build/windows/distribution/Agent-Host-*.zip

  publish:
    needs: [github-tools, macos, windows]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          path: .build/release-assets
      - name: Create unsigned GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$'Unsigned preview. Not Apple-notarized and not an App Store build.\n\nApplication carriers and the GitHub tool catalog are separate Release assets. Do not treat GitHub latest as a tool catalog.\n\nmacOS: Control-click Agent Host.app, choose Open, confirm Gatekeeper.\nWindows: SmartScreen may warn; compare SHA-256 before running.\n\nThe bundled application catalog is a packaging fixture. Featured tools such as Armorial are admitted from their own GitHub Releases (see github-tools artifacts).\n\nprofiles fetch --carrier downloads an installer; it does not replace or relaunch Agent Host. Use app update on a supported OS after comparing digests.'
          files=()
          while IFS= read -r path; do files+=("$path"); done < <(find .build/release-assets -type f)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" \
            --prerelease --verify-tag --title "Agent Host unsigned preview" --notes "$notes"
