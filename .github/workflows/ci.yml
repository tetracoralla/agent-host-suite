name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: npm run check

  macos-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci
      - run: ./scripts/check-manager-models.sh
      - run: swift build
      - run: ./scripts/package-macos-app.sh debug
      - run: codesign --verify --deep --strict ".build/Agent Host.app"
